[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-radar"
version = "0.1.0"
description = "Core services for the Opportunity Radar community workflow"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
radar = "opportunity_radar.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
